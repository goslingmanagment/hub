name: Nightly

# PR/main CI already runs every test file except the non-critical cases in the
# large API integration file. Nightly covers only that remaining surface.

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  full-api:
    name: Full API integration file
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API integration tests (all cases)
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm exec vitest run --no-file-parallelism tests/api.integration.test.ts
