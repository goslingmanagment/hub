name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Run every gate job even when this tree's fingerprint has already passed"
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR heads stop burning runners; main always runs to completion so
# every main commit keeps a finished Quality Gate record.
concurrency:
  # A PR shares one group per head ref, so a new push cancels the old run. A
  # push or manual run gets a group of its own: GitHub keeps only ONE pending
  # run per group, and a shared ref group let a newer main push evict an
  # older pending one before it ever ran.
  # A metadata-only event — a description edit (no title or base change) or a
  # label other than ci:full — gets its own group so it never cancels the real
  # run for the same head; it still reports "Quality Gate" itself (see the
  # job), so the newest check suite for that head keeps the required check.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}${{ ((github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) || (github.event.action == 'labeled' && github.event.label.name != 'ci:full')) && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Drafts run only admission/gate jobs. Ready PRs and main reuse matching gate
# or DB proofs; a proof miss or lookup error executes the affected checks in
# full. CI never publishes an image: production images build on the server.
#
# Runner pool: the repository variable CI_POOL=pc sends every job — the gate
# fingerprint, static, integration and the Quality Gate — to the owner's
# self-hosted runners; any other value, and every re-run (the PC may have died
# mid-run), uses GitHub-hosted runners. A PC that is off leaves the jobs queued
# (`ci-pool rescue` / `ci-pool watch` cancel them and re-run them on GitHub).
# The PC image has no Node.js on PATH and no GitHub CLI: a job that runs a
# Node script there sets Node up first, and the gate scripts call the GitHub
# API through Node's own fetch (scripts/ci-github-api.mjs).
#
# Economy mode (CI_POOL is not pc): a PR runs the integration shards only when
# it is opened, reopened or marked ready for review, while it carries the
# label ci:full, or on any re-run (a stuck PC run re-run on GitHub must not
# turn red for want of shards). Other pushes to a ready PR run static checks
# only, and the Quality Gate stays red until integration has run (or is
# proven) for the head.
jobs:
  fingerprint:
    name: Gate fingerprint
    if: (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    # On the PC both gate jobs (this one and the Quality Gate) ask for the
    # control class. Hub's light gate runners carry only ci-pc-control, so a
    # gate need not wait behind a batch's heavy jobs; the heavy runners carry
    # ci-pc-control beside ci-pc, so the gates fall back to them while the
    # light ones are busy or down. Every other job asks for ci-pc, which the
    # light runners lack, so heavy work never lands on them.
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc-control"]') || 'ubuntu-slim' }}
    timeout-minutes: 5
    # Artifact lookup and producer validation need actions:read; no writes.
    permissions:
      actions: read
      contents: read
    outputs:
      hash: ${{ steps.fingerprint.outputs.hash }}
      proven_by: ${{ steps.lookup.outputs.proven_by }}
      integration_hash: ${{ steps.fingerprint.outputs.integration_hash }}
      integration_proven_by: ${{ steps.lookup.outputs.integration_proven_by }}
      shards: ${{ steps.shards.outputs.shards }}
      shard_total: ${{ steps.shards.outputs.shard_total }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-slim ships Node.js; the PC has none on PATH. Node 22 comes from
      # the runner's own tool cache: static and integration jobs keep it warm
      # on the heavy runners, and a light gate runner downloads it once, on
      # its first gate. No pnpm: these scripts import nothing outside Node.
      - name: Setup Node.js
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The integration matrix: three shards, or CI_PC_SHARDS (1..8) on a
      # first attempt on the PC. See scripts/ci-shards.mjs.
      - name: Plan integration shards
        id: shards
        env:
          CI_POOL: ${{ vars.CI_POOL }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_PC_SHARDS: ${{ vars.CI_PC_SHARDS }}
        run: node scripts/ci-shards.mjs

      - name: Fingerprint the gate-visible tree
        id: fingerprint
        run: |
          hash="$(bash scripts/ci-gate-fingerprint.sh)"
          integration_hash="$(bash scripts/ci-gate-fingerprint.sh HEAD integration)"
          [[ "$integration_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "integration_hash=${integration_hash}" >> "$GITHUB_OUTPUT"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${hash}"

      - name: Look up earlier passing checks
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
          INTEGRATION_FINGERPRINT: ${{ steps.fingerprint.outputs.integration_hash }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci-find-proof.mjs

  # A full-tree proof skips this job on a PR and on main alike: nothing
  # downstream consumes the image any more, so a tree that already passed is
  # not rebuilt. An integration-only proof never skips it.
  static:
    name: Static checks
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.proven_by == ''
    timeout-minutes: 25
    env:
      # The full workspace type graph exceeds Node 22's default 2 GiB heap.
      # Keep compilation bounded; test scripts retain their own explicit limits.
      NODE_OPTIONS: --max-old-space-size=4096
      # Self-hosted runners share one Docker daemon: a per-run tag keeps
      # concurrent jobs from building over or smoke-testing each other's image.
      IMAGE: agency_hub_core/runtime:ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Hosted runners: pnpm version comes from package.json "packageManager" —
      # one pin, no drift. The action wipes its install directory first, so it
      # stays in runner.temp.
      - name: Setup pnpm
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # Hosted runners restore the pnpm store from the Actions cache.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      # Self-hosted: pnpm through the corepack bundled with Node 22, at the
      # exact version package.json "packageManager" pins. Corepack keeps each
      # version it downloaded (and verified against the npm registry's
      # signature) in one cache under the shared $HOME, so a job no longer
      # downloads pnpm; a download lands in a temporary directory that is
      # renamed into place, so concurrent runners cannot leave a partial one.
      # The shims go in this job's runner.temp; nothing else in $HOME changes.
      - name: Setup pnpm (corepack)
        if: runner.environment == 'self-hosted'
        env:
          # Never rewrite corepack's shared lastKnownGood.json after a download.
          COREPACK_DEFAULT_TO_LATEST: "0"
        run: |
          bin="$RUNNER_TEMP/corepack-bin"
          mkdir -p "$bin"
          corepack enable pnpm --install-directory "$bin"
          pinned="$(node -p 'require("./package.json").packageManager')"
          running="$("$bin/pnpm" --version)"
          echo "corepack $(corepack --version) runs pnpm $running; package.json pins $pinned"
          [ "pnpm@$running" = "${pinned%%+*}" ] || { echo "::error::corepack runs pnpm $running but package.json pins $pinned"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"

      # The PC's runners share one pnpm store in $HOME, named explicitly so no
      # PNPM_HOME can move it: pnpm's store is safe for concurrent installs,
      # and $HOME is on the same filesystem as _work, so packages hard-link
      # instead of copying. Hosted runners keep pnpm's default store, the one
      # setup-node caches.
      - name: Install dependencies
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      # Contracts come first: the generator rewrites tracked sources in place
      # (contract hash, SDK), and the unit tests started next import them.
      # routes.ts freshness: the sdk determinism test pins openapi↔sdk↔hash
      # consistency, but editing routes.ts without `pnpm contracts:generate`
      # kept the committed artifacts mutually consistent yet stale. The
      # generator boots the API server with a stub config — no DB needed.
      # `git status`, not `git diff`: a NEW generated file is untracked, and
      # `git diff` never lists one, so a generator that adds an SDK module
      # would pass with the module uncommitted.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        run: |
          pnpm contracts:generate
          generated=(reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md)
          drift="$(git status --porcelain --untracked-files=all -- "${generated[@]}")"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            git --no-pager diff -- "${generated[@]}"
            echo "::error::Generated contracts are stale: run pnpm contracts:generate and commit every file it changes or adds."
            exit 1
          fi

      # Self-hosted: the unit tests run in a process group of their own beside
      # typecheck → image build → smokes, and "Reliable unit tests" joins
      # them. The PC's 24 threads are shared with the integration shards
      # running at the same time; typecheck (single-threaded tsc) is the long
      # pole of the other branch, and five workers finish the unit tests about
      # when that branch ends (measured on the PC: 6 workers ~70 s, 4 ~97 s,
      # against ~90 s for the checks, lint then included) without adding load
      # that buys nothing.
      # Hosted runners (2 vCPUs) skip this and run the unit tests in that step
      # instead, after the smokes, as before.
      - name: Start reliable unit tests in the background
        id: unit-tests
        if: runner.environment == 'self-hosted'
        run: |
          bash scripts/ci-background.sh start unit-tests pnpm test:unit --maxWorkers=5
          echo "started=true" >> "$GITHUB_OUTPUT"

      # Self-hosted: the lint (single-threaded ESLint, ~30 s on the PC) runs
      # the same way beside typecheck instead of after it, and the Lint step
      # below joins it. Hosted runners skip this and lint in that step, as
      # before.
      - name: Start lint in the background
        id: lint
        if: runner.environment == 'self-hosted'
        run: |
          bash scripts/ci-background.sh start lint pnpm lint
          echo "started=true" >> "$GITHUB_OUTPUT"

      # Check backend types once. Docker explicitly consumes this successful
      # check; direct Docker builds still check.
      - name: Typecheck
        run: pnpm typecheck

      # Self-hosted: wait for the background lint, print its whole log and
      # take its exit status, like "Reliable unit tests": it is joined even
      # when typecheck failed, and the image build waits for its verdict.
      - name: Lint (family standard + architecture walls)
        if: "!cancelled() && (success() || steps.lint.outputs.started == 'true')"
        env:
          IN_BACKGROUND: ${{ steps.lint.outputs.started }}
        run: |
          if [ "$IN_BACKGROUND" = "true" ]; then
            bash scripts/ci-background.sh join lint
          else
            pnpm lint
          fi

      - name: Exact checkout image metadata
        id: metadata
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/deploy-metadata.sh >> "$GITHUB_OUTPUT"

      # Hosted runners build in a throwaway BuildKit container backed by the
      # GitHub Actions layer cache. Self-hosted runners build on the local
      # daemon, whose layer cache persists on the PC; the docker driver cannot
      # export to the gha cache, and naming the builder keeps a shared $HOME's
      # "current builder" out of the picture.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'docker' || 'docker-container' }}

      # Self-hosted: no build summary and no build record artifact. The
      # action's post step would export the record from the PC daemon's
      # history and upload it to GitHub (~3 s a run); no check reads either.
      # Hosted runners keep the action's defaults: it reads an empty value as
      # unset.
      - name: Production Docker image build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: ${{ runner.environment == 'self-hosted' && 'false' || '' }}
          DOCKER_BUILD_RECORD_UPLOAD: ${{ runner.environment == 'self-hosted' && 'false' || '' }}
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          pull: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_SOURCE_REVISION=${{ steps.metadata.outputs.source_revision }}
            APP_DEPENDENCY_CHECKSUM=${{ steps.metadata.outputs.dependency_checksum }}
            CI_TYPECHECK_ALREADY_PASSED=true
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=hub-runtime-amd64' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=hub-runtime-amd64,mode=max,ignore-error=true' || '' }}

      - name: Chromium Headless Shell runtime smoke
        run: docker run --rm --entrypoint node "$IMAGE" scripts/smoke-playwright-runtime.mjs

      - name: Native image library smoke
        # The AI media describer loads sharp lazily; prove the prebuilt libvips
        # binding for the target platform resolves from the runtime package.
        run: |
          docker run --rm -w /app/apps/runtime --entrypoint node "$IMAGE" \
            --input-type=module -e "const { default: sharp } = await import('sharp'); const out = await sharp({ create: { width: 300, height: 200, channels: 3, background: '#808080' } }).jpeg().toBuffer(); if (out.length < 100) throw new Error('sharp produced no JPEG'); console.log('sharp', sharp.versions.sharp, 'vips', sharp.versions.vips);"

      - name: Startup capability manifest smoke
        run: |
          capabilities="$(docker run --rm --entrypoint node "$IMAGE" apps/runtime/dist/startup.js print-public-capabilities)"
          node -e '
            const capabilities = JSON.parse(process.argv[1]);
            if (!Array.isArray(capabilities) || !capabilities.every(value => typeof value === "string")) {
              throw new Error("Public capability manifest must be an array of strings");
            }
            process.stdout.write(JSON.stringify(capabilities) + "\n");
          ' "$capabilities"

      # NOTE: this step still starts Postgres containers — tests/voice-profiles
      # and tests/voice-notes-sweep are DB-backed despite not being named
      # *.integration.test.ts, so they are not in the --exclude list.
      #
      # Self-hosted: wait for the background run, print its whole log and take
      # its exit status. It is joined even when a check above failed, so one
      # push reports both; only a cancelled job skips it. Hosted: vitest
      # defaults to CPUs - 1, so a 2-vCPU runner would use one worker — keep
      # per-file isolation while using both CPUs.
      - name: Reliable unit tests
        if: "!cancelled() && (success() || steps.unit-tests.outputs.started == 'true')"
        env:
          IN_BACKGROUND: ${{ steps.unit-tests.outputs.started }}
        run: |
          if [ "$IN_BACKGROUND" = "true" ]; then
            bash scripts/ci-background.sh join unit-tests
          else
            pnpm test:unit --maxWorkers=2
          fi

      # A cancelled or timed-out job never joins: print what the unit tests
      # logged and kill their whole process group. Never decides the result.
      - name: Stop background unit tests
        if: always()
        run: bash scripts/ci-background.sh stop unit-tests

      # The same for the lint (a job cancelled during typecheck).
      - name: Stop background lint
        if: always()
        run: bash scripts/ci-background.sh stop lint

      # A self-hosted daemon outlives the job: drop this run's tag (its layers
      # stay in the builder cache). Cleanup never decides the job's result.
      - name: Remove this run's image
        if: always()
        run: docker image rm "$IMAGE" || true

  # The sync-critical suite is ~120 database acquisitions over ~104 files and is
  # the whole reason a PR used to wait ~18 minutes. Splitting it across runners
  # is the cheap win: separate machines, each keeping --no-file-parallelism
  # (the PC runs two files at a time per shard; see the DB step).
  # Since #240 a shard runs ONE cluster and clones a database per acquisition,
  # so "no shared cluster" no longer holds: queries against cluster-global views
  # (pg_locks, pg_stat_activity) must scope themselves to current_database() or
  # a backend pid, and a role is created once for the run (read_only, in
  # tests/helpers/global-setup.ts), by a fixture that tolerates a concurrent
  # creator, or under a name only one file uses. tests/db-isolation-policy.test.ts
  # enforces both.
  # Sharding is by resolved FILE, so it is applied to the
  # :db half directly; `test:prerequisites` is a compound `A && B` and trailing
  # args would land only on B.
  #
  # The files are packed by measured duration, not split by count: the root
  # Vitest config's sequencer reads tests/ci/shard-weights.json and gives
  # shard 1 less file work for the API run it adds. Regenerate the weights
  # from green full runs with scripts/ci-shard-weights.mjs (see its header);
  # a file without a weight takes the median and still runs.
  #
  # The hosted fallback is arm64: the shards run only vitest against
  # Testcontainers Postgres (multi-arch) and never build the amd64 image.
  # In economy mode (see the top of `jobs`) a first-attempt PR push that is not
  # an open, reopen or ready-for-review, and carries no ci:full label, skips
  # the shards; the Quality Gate then fails and says how to run them.
  #
  # The fingerprint job plans the shard count: three, or the repository
  # variable CI_PC_SHARDS (1..8) on a first attempt on the PC. "Re-run failed
  # jobs" reuses the first attempt's plan, so a re-run leg keeps its shard
  # total. The fallbacks below only keep fromJSON off an empty string; this
  # job cannot run unless the fingerprint job succeeded and set both outputs.
  integration:
    name: Integration ${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 3 }}
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04-arm' }}
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.integration_proven_by == '' && (vars.CI_POOL == 'pc' || github.run_attempt != '1' || github.event_name != 'pull_request' || contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action) || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    # 30 stopped fitting on 2026-08-17: vitest --shard then split by FILE
    # COUNT, not duration, and after a week that added four integration files
    # one shard drew a slow-heavy set and was cancelled at 30:18 with every
    # test green (the #80 merge push on main was cancelled the same way). 45
    # lets the existing gate FINISH — it does not weaken it, and a healthy run
    # spends nothing extra.
    timeout-minutes: 45
    strategy:
      # A PR needs one red shard to send the author back; the others would
      # bill ~10 minutes each to say the same thing. Main keeps the complete
      # record of every shard for its gate history.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: ${{ fromJSON(needs.fingerprint.outputs.shards || '[1,2,3]') }}

    # Checkout, pnpm and the install as in static checks.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: runner.environment != 'self-hosted'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Setup pnpm (corepack)
        if: runner.environment == 'self-hosted'
        env:
          COREPACK_DEFAULT_TO_LATEST: "0"
        run: |
          bin="$RUNNER_TEMP/corepack-bin"
          mkdir -p "$bin"
          corepack enable pnpm --install-directory "$bin"
          pinned="$(node -p 'require("./package.json").packageManager')"
          running="$("$bin/pnpm" --version)"
          echo "corepack $(corepack --version) runs pnpm $running; package.json pins $pinned"
          [ "pnpm@$running" = "${pinned%%+*}" ] || { echo "::error::corepack runs pnpm $running but package.json pins $pinned"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      # A shard runs its files one at a time (the script's default,
      # --no-file-parallelism). On the PC it runs two at a time: each file
      # still clones its own database from the shard's one cluster, and
      # anything cluster-wide in those files is scoped or created once in
      # tests/helpers/global-setup.ts. Hosted runners keep the default.
      #
      # On the PC the shard's test cluster keeps PGDATA in a tmpfs
      # (HUB_TEST_PG_TMPFS, tests/helpers/global-setup.ts): the cluster is thrown
      # away with the run, fsync is already off, and on disk its WAL and cloned
      # databases were ~8 GiB of writes a full run, most of the PC's SSD wear
      # (measured 01.10: 8.1-8.4 GiB a run on disk, 2.1 GiB with the tmpfs, no
      # slower, peak cluster ~270 MiB a shard). Hosted runners and the Nightly
      # full suite keep it on disk.
      - name: Sync-critical DB/schema/network tests (shard ${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 3 }})
        env:
          SYNC_CRITICAL_DB_PARALLELISM: ${{ runner.environment == 'self-hosted' && '--fileParallelism --maxWorkers=2' || '' }}
          HUB_TEST_PG_TMPFS: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: pnpm test:sync-critical:db --shard=${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 3 }}

      # One file, ~20s on the PC — it resolves to a single spec so it cannot
      # be sharded; the weights' firstShardExtraSeconds accounts for it.
      - name: Sync-critical API tests
        if: matrix.shard == 1
        env:
          HUB_TEST_PG_TMPFS: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: pnpm test:sync-critical:api

  # Branch protection requires a check named exactly "Quality Gate". A matrix
  # job publishes "Integration 1/3", "Integration 2/3", … which would satisfy
  # nothing, so this aggregator keeps the required name and fails unless every
  # dependency succeeded. `if: always()` is required — without it a skipped
  # aggregator reports success to the ruleset.
  #
  # With a proven fingerprint the test jobs are skipped by design and the gate
  # passes on the earlier run's evidence; a fingerprint job that failed leaves
  # `proven_by` empty, so every skip that is NOT backed by a proof still fails
  # — including integration skipped by economy mode.
  #
  # The name is the literal "Quality Gate" in every event and the job runs in
  # every event. GitHub resolves a required check against the NEWEST check
  # suite for the head SHA, so a run that renames or skips this job takes the
  # gate off that head and the PR becomes unmergeable with every check green
  # (Decision 377). A metadata-only event therefore still runs this job and
  # mirrors the verdict of the NEWEST gate another real run recorded for the
  # same SHA (scripts/ci-mirror-gate.mjs): a newer red gate beats an older
  # green one, and a missing gate stays red. Its own run is the newest suite,
  # so whatever it reports stands until the next event: while a real run on
  # the head is still working, it waits for that verdict (MIRROR_WAIT_MS,
  # then red) rather than repeating an older one.
  #
  # On the PC the job asks for the gate runner class (ci-pc-control), as the
  # fingerprint job does. It queues like any other when the PC is off,
  # metadata-only runs included; `ci-pool rescue` re-runs it on GitHub
  # (attempt 2).
  quality:
    name: Quality Gate
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc-control"]') || 'ubuntu-slim' }}
    needs: [fingerprint, static, integration]
    if: always()
    # The mirror's wait for a real run on the same head plus setup; the
    # aggregating path takes seconds.
    timeout-minutes: 45
    # Reading this head's workflow runs and earlier check runs on a private
    # repository needs actions:read and checks:read. Nothing in this job writes.
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      # A metadata-only event: a description edit (no code, no title, no base)
      # or a label other than ci:full — and, by their own conditions, no gate
      # jobs to aggregate.
      METADATA_ONLY: ${{ (github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) || (github.event.action == 'labeled' && github.event.label.name != 'ci:full') }}

    steps:
      - name: Checkout
        if: env.METADATA_ONLY == 'true'
        uses: actions/checkout@v6

      # Only the mirror runs Node; see the fingerprint job.
      - name: Setup Node.js
        if: env.METADATA_ONLY == 'true' && runner.environment == 'self-hosted'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: An earlier run already passed this head
        if: env.METADATA_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-mirror-gate.mjs

      - name: Every gate job succeeded
        if: env.METADATA_ONLY != 'true'
        env:
          PROVEN_BY: ${{ needs.fingerprint.outputs.proven_by }}
          INTEGRATION_PROVEN_BY: ${{ needs.fingerprint.outputs.integration_proven_by }}
          FINGERPRINT_RESULT: ${{ needs.fingerprint.result }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.hash }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          # Only explains a failure; it never decides one.
          ECONOMY: ${{ github.event_name == 'pull_request' && vars.CI_POOL != 'pc' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATIC: ${{ needs.static.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          [ "$IS_DRAFT" != "true" ] || { echo "Draft PR: mark ready for review to run checks."; exit 1; }
          [ "$FINGERPRINT_RESULT" = "success" ] || exit 1
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || exit 1
          if [ -n "$PROVEN_BY" ]; then
            [ "$INTEGRATION" = "skipped" ] || exit 1
            case "$STATIC" in success|skipped) ;; *) exit 1 ;; esac
            echo "Quality Gate reused run ${PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -z "$INTEGRATION_PROVEN_BY" ] && [ "$INTEGRATION" = "skipped" ] && [ "$ECONOMY" = "true" ]; then
              echo "::error title=Integration tests did not run::Economy mode (CI_POOL is not pc) runs only static checks on pushes to a ready PR. When this PR is final, run: gh pr edit ${PR_NUMBER} --add-label ci:full (or convert it to draft and mark it ready again)."
              exit 1
            fi
            [ "$STATIC" = "success" ] || exit 1
            if [ -n "$INTEGRATION_PROVEN_BY" ]; then
              [ "$INTEGRATION" = "skipped" ] || exit 1
              echo "Static checks fresh; integration reused run ${INTEGRATION_PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
            else
              [ "$INTEGRATION" = "success" ] || exit 1
              echo "All checks ran fresh." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Record this fingerprint as proven
        if: env.METADATA_ONLY != 'true' && needs.fingerprint.outputs.proven_by == ''
        run: |
          mkdir -p "$RUNNER_TEMP/quality-gate"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/quality-gate/run-id"

      - name: Publish the proof for later identical trees
        if: env.METADATA_ONLY != 'true' && needs.fingerprint.outputs.proven_by == ''
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-${{ needs.fingerprint.outputs.hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish fresh integration proof
        if: needs.integration.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: integration-gate-${{ needs.fingerprint.outputs.integration_hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true
