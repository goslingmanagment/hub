name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Run every gate job even when this tree's fingerprint has already passed"
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR heads stop burning runners; main always runs to completion so
# every main commit keeps a finished gate record (and a published image).
concurrency:
  # A body-only edit gets its own group so it never cancels the real run for
  # the same head; it still reports "Quality Gate" itself (see the job), so the
  # newest check suite for that head keeps the required check.
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Drafts run only admission/gate jobs. Ready PRs reuse matching gate or DB
# proofs; a proof miss or lookup error executes the affected checks in full.
# Main always builds, smoke-tests and publishes its own exact-revision image.
jobs:
  fingerprint:
    name: Gate fingerprint
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Artifact lookup and producer validation need actions:read; no writes.
    permissions:
      actions: read
      contents: read
    outputs:
      hash: ${{ steps.fingerprint.outputs.hash }}
      proven_by: ${{ steps.lookup.outputs.proven_by }}
      integration_hash: ${{ steps.fingerprint.outputs.integration_hash }}
      integration_proven_by: ${{ steps.lookup.outputs.integration_proven_by }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fingerprint the gate-visible tree
        id: fingerprint
        run: |
          hash="$(bash scripts/ci-gate-fingerprint.sh)"
          integration_hash="$(bash scripts/ci-gate-fingerprint.sh HEAD integration)"
          [[ "$integration_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "integration_hash=${integration_hash}" >> "$GITHUB_OUTPUT"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${hash}"

      - name: Look up earlier passing checks
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
          INTEGRATION_FINGERPRINT: ${{ steps.fingerprint.outputs.integration_hash }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci-find-proof.mjs

  # On a PR a proven fingerprint skips this job entirely. On main it still
  # runs — the deploy pulls the image this job builds and `publish` pushes —
  # but the checks that the fingerprint already proved are skipped.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && (needs.fingerprint.outputs.proven_by == '' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    timeout-minutes: 25
    # The full workspace type graph exceeds Node 22's default 2 GiB heap.
    # Keep compilation bounded; test scripts retain their own explicit limits.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      source_revision: ${{ steps.metadata.outputs.source_revision }}
      dependency_checksum: ${{ steps.metadata.outputs.dependency_checksum }}
      image_id: ${{ steps.build-image.outputs.image_id }}
      artifact_id: ${{ steps.upload-image.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager" — one pin, no drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Check backend types once. Docker explicitly consumes this successful
      # check or the matching full-tree proof; direct Docker builds still check.
      - name: Typecheck
        if: needs.fingerprint.outputs.proven_by == ''
        run: pnpm typecheck

      - name: Lint (family standard + architecture walls)
        if: needs.fingerprint.outputs.proven_by == ''
        run: pnpm lint

      # routes.ts freshness: the sdk determinism test pins openapi↔sdk↔hash
      # consistency, but editing routes.ts without `pnpm contracts:generate`
      # kept the committed artifacts mutually consistent yet stale. The
      # generator boots the API server with a stub config — no DB needed.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        if: needs.fingerprint.outputs.proven_by == ''
        run: |
          pnpm contracts:generate
          git diff --exit-code reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md

      - name: Exact checkout image metadata
        id: metadata
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/deploy-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Production Docker image build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          pull: true
          tags: agency_hub_core/runtime:ci
          build-args: |
            APP_SOURCE_REVISION=${{ steps.metadata.outputs.source_revision }}
            APP_DEPENDENCY_CHECKSUM=${{ steps.metadata.outputs.dependency_checksum }}
            CI_TYPECHECK_ALREADY_PASSED=true
          cache-from: type=gha,scope=hub-runtime-amd64
          cache-to: type=gha,scope=hub-runtime-amd64,mode=max,ignore-error=true

      - name: Record checked image identity
        id: build-image
        run: docker image inspect --format 'image_id={{.Id}}' agency_hub_core/runtime:ci >> "$GITHUB_OUTPUT"

      - name: Chromium Headless Shell runtime smoke
        run: docker run --rm --entrypoint node agency_hub_core/runtime:ci scripts/smoke-playwright-runtime.mjs

      - name: Startup capability manifest smoke
        run: |
          capabilities="$(docker run --rm --entrypoint node agency_hub_core/runtime:ci apps/runtime/dist/startup.js print-public-capabilities)"
          node -e '
            const capabilities = JSON.parse(process.argv[1]);
            if (!Array.isArray(capabilities) || !capabilities.every(value => typeof value === "string")) {
              throw new Error("Public capability manifest must be an array of strings");
            }
            process.stdout.write(JSON.stringify(capabilities) + "\n");
          ' "$capabilities"

      # NOTE: this step still starts Postgres containers — tests/voice-profiles
      # and tests/voice-notes-sweep are DB-backed despite not being named
      # *.integration.test.ts, so they are not in the --exclude list.
      - name: Reliable unit tests
        if: needs.fingerprint.outputs.proven_by == ''
        # Vitest defaults to CPUs - 1: a 2-vCPU runner otherwise uses one
        # worker. Keep per-file isolation while using both available CPUs.
        run: pnpm test:unit --maxWorkers=2

      # Only a trusted main push hands an image to the publishing job. The
      # artifact comes from this exact run, after both final-image smoke tests;
      # publishing still waits for every existing Quality Gate dependency.
      - name: Save checked production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build-image.outputs.image_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/checked-runtime"
          test "$(docker image inspect --format '{{.Id}}' agency_hub_core/runtime:ci)" = "$EXPECTED_IMAGE_ID"
          docker save --output "$RUNNER_TEMP/checked-runtime/runtime-image.tar" agency_hub_core/runtime:ci

      - name: Upload checked production image
        id: upload-image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: checked-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-runtime/runtime-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  # The sync-critical suite is ~120 database acquisitions over ~104 files and is
  # the whole reason a PR used to wait ~18 minutes. Splitting it across runners
  # is the cheap win: separate machines, each keeping --no-file-parallelism.
  # Since #240 a shard runs ONE cluster and clones a database per acquisition,
  # so "no shared cluster" no longer holds: queries against cluster-global views
  # (pg_locks, pg_stat_activity) must scope themselves to current_database().
  # Sharding is by resolved FILE, so it is applied to the
  # :db half directly; `test:prerequisites` is a compound `A && B` and trailing
  # args would land only on B.
  integration:
    name: Integration ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.integration_proven_by == ''
    # 30 stopped fitting on 2026-08-17: vitest --shard splits by FILE COUNT,
    # not duration, and after a week that added four integration files one
    # shard drew a slow-heavy set and was cancelled at 30:18 with every test
    # green (the #80 merge push on main was cancelled the same way). 45 lets
    # the existing gate FINISH — it does not weaken it, and a healthy run
    # spends nothing extra.
    timeout-minutes: 45
    strategy:
      # A PR needs one red shard to send the author back; the other two would
      # bill ~10 minutes each to say the same thing. Main keeps the complete
      # record of every shard for its gate history.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync-critical DB/schema/network tests (shard ${{ matrix.shard }}/3)
        run: pnpm test:sync-critical:db --shard=${{ matrix.shard }}/3

      # One file, ~36s — it resolves to a single spec so it cannot be sharded.
      - name: Sync-critical API tests
        if: matrix.shard == 1
        run: pnpm test:sync-critical:api

  # Branch protection requires a check named exactly "Quality Gate". A matrix
  # job publishes "Integration 1/3", "Integration 2/3", … which would satisfy
  # nothing, so this aggregator keeps the required name and fails unless every
  # dependency succeeded. `if: always()` is required — without it a skipped
  # aggregator reports success to the ruleset.
  #
  # With a proven fingerprint the test jobs are skipped by design and the gate
  # passes on the earlier run's evidence; a fingerprint job that failed leaves
  # `proven_by` empty, so every skip that is NOT backed by a proof still fails.
  #
  # The name is the literal "Quality Gate" in every event and the job runs in
  # every event. GitHub resolves a required check against the NEWEST check
  # suite for the head SHA, so a run that renames or skips this job takes the
  # gate off that head and the PR becomes unmergeable with every check green
  # (Decision 377). A description-only edit therefore still runs this job and
  # mirrors the verdict an earlier run recorded for the same SHA; it cannot
  # manufacture one, so a red, pending or missing gate stays that way.
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [fingerprint, static, integration]
    if: always()
    timeout-minutes: 5
    # Reading this head's earlier check runs on a private repository needs
    # checks:read. Nothing in this job writes.
    permissions:
      checks: read
      contents: read
    env:
      # A description-only edit: no code, no title, no base — and, by their own
      # conditions, no gate jobs to aggregate.
      BODY_EDIT: ${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base }}

    steps:
      - name: Checkout
        if: env.BODY_EDIT == 'true'
        uses: actions/checkout@v6

      - name: An earlier run already passed this head
        if: env.BODY_EDIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-mirror-gate.mjs

      - name: Every gate job succeeded
        if: env.BODY_EDIT != 'true'
        env:
          PROVEN_BY: ${{ needs.fingerprint.outputs.proven_by }}
          INTEGRATION_PROVEN_BY: ${{ needs.fingerprint.outputs.integration_proven_by }}
          FINGERPRINT_RESULT: ${{ needs.fingerprint.result }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.hash }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          REQUIRE_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          STATIC: ${{ needs.static.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          [ "$IS_DRAFT" != "true" ] || { echo "Draft PR: mark ready for review to run checks."; exit 1; }
          [ "$FINGERPRINT_RESULT" = "success" ] || exit 1
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || exit 1
          if [ "$REQUIRE_IMAGE" = "true" ]; then
            [ "$STATIC" = "success" ] || exit 1
          fi
          if [ -n "$PROVEN_BY" ]; then
            [ "$INTEGRATION" = "skipped" ] || exit 1
            case "$STATIC" in success|skipped) ;; *) exit 1 ;; esac
            echo "Quality Gate reused run ${PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
          else
            [ "$STATIC" = "success" ] || exit 1
            if [ -n "$INTEGRATION_PROVEN_BY" ]; then
              [ "$INTEGRATION" = "skipped" ] || exit 1
              echo "Static checks fresh; integration reused run ${INTEGRATION_PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
            else
              [ "$INTEGRATION" = "success" ] || exit 1
              echo "All checks ran fresh." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Record this fingerprint as proven
        if: env.BODY_EDIT != 'true' && needs.fingerprint.outputs.proven_by == ''
        run: |
          mkdir -p "$RUNNER_TEMP/quality-gate"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/quality-gate/run-id"

      - name: Publish the proof for later identical trees
        if: env.BODY_EDIT != 'true' && needs.fingerprint.outputs.proven_by == ''
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-${{ needs.fingerprint.outputs.hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish fresh integration proof
        if: needs.integration.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: integration-gate-${{ needs.fingerprint.outputs.integration_hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # `!cancelled()` is load-bearing: a skipped job (the integration matrix on a
  # proven tree) propagates "skipped" down the whole needs chain, and a job
  # without a status function inherits it even when its direct dependencies
  # succeeded — the first fingerprint-gated main run published nothing.
  publish:
    name: Publish checked production image
    runs-on: ubuntu-latest
    needs: [static, quality]
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success'"
    timeout-minutes: 15
    # The only write token in this workflow. PRs and manual dispatches cannot
    # enter this job; no checkout/build/test code runs with package permission.
    permissions:
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Download this run's checked image
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.static.outputs.artifact_id }}
          path: ${{ runner.temp }}/checked-runtime
          merge-multiple: true
          digest-mismatch: error

      - name: Verify checked image identity and labels
        env:
          EXPECTED_IMAGE_ID: ${{ needs.static.outputs.image_id }}
          EXPECTED_SOURCE_REVISION: ${{ needs.static.outputs.source_revision }}
          EXPECTED_DEPENDENCY_CHECKSUM: ${{ needs.static.outputs.dependency_checksum }}
        run: |
          docker load --input "$RUNNER_TEMP/checked-runtime/runtime-image.tar"
          test "$(docker image inspect --format '{{.Id}}' agency_hub_core/runtime:ci)" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "agency-hub.source-revision"}}' agency_hub_core/runtime:ci)" = "$EXPECTED_SOURCE_REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "agency-hub.dependency-checksum"}}' agency_hub_core/runtime:ci)" = "$EXPECTED_DEPENDENCY_CHECKSUM"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' agency_hub_core/runtime:ci)" = 'linux/amd64'

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish exact commit and record immutable digest
        id: publish
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}/runtime"
          commit_image="${registry_image}:${GITHUB_SHA}"
          docker tag agency_hub_core/runtime:ci "$commit_image"
          docker push "$commit_image"
          image_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$commit_image" | awk -v prefix="${registry_image}@" 'index($0, prefix) == 1 { print; exit }')"
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\ndigest=%s\n' "$image_ref" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Checked production image for %s: %s\n' "$GITHUB_SHA" "$image_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
