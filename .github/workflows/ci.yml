name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Stage 19 module boundaries)
        run: pnpm lint

      - name: Production build
        run: pnpm build:production

      - name: Production Docker image build
        run: docker build --target runtime -t agency_hub_core/runtime:ci .

      - name: Reliable unit tests
        run: pnpm test:unit

      - name: Sync-critical DB/schema/network tests
        run: pnpm test:prerequisites
