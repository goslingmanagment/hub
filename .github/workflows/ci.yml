name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded PR runs; keep a finished gate for every main commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager" — one pin, no drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (family standard + architecture walls)
        run: pnpm lint

      # The SDK determinism test cannot detect a stale routes.ts source.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        run: |
          pnpm contracts:generate
          git diff --exit-code reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md

      # Dockerfile runs build:production, including the typecheck.
      - name: Production Docker image build
        run: docker build --target runtime -t agency_hub_core/runtime:ci .

      - name: Chromium Headless Shell runtime smoke
        run: docker run --rm --entrypoint node agency_hub_core/runtime:ci scripts/smoke-playwright-runtime.mjs

      # Some non-*.integration tests still start Postgres containers.
      - name: Reliable unit tests
        run: pnpm test:unit

  # Separate runners keep Testcontainers isolated while cutting the critical path.
  integration:
    name: Integration ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # Vitest shards by file count, not duration; slow-heavy shards need this ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync-critical DB/schema/network tests (shard ${{ matrix.shard }}/3)
        run: pnpm test:sync-critical:db --shard=${{ matrix.shard }}/3

      - name: Sync-critical API tests
        if: matrix.shard == 1
        run: pnpm test:sync-critical:api

  # Branch protection requires this exact aggregate check name.
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [static, integration]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Every gate job succeeded
        run: |
          echo "static=${{ needs.static.result }} integration=${{ needs.integration.result }}"
          [ "${{ needs.static.result }}" = "success" ] || exit 1
          [ "${{ needs.integration.result }}" = "success" ] || exit 1
