name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Superseded PR heads cancel their runs (July 2026: stacked stale runs
    # were the main Actions cost driver); main runs always complete so every
    # main commit keeps a finished fast-gate record.
    concurrency:
      group: qg-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager" — one pin, no drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (family standard + architecture walls)
        run: pnpm lint

      # routes.ts freshness: the sdk determinism test pins openapi↔sdk↔hash
      # consistency, but editing routes.ts without `pnpm contracts:generate`
      # kept the committed artifacts mutually consistent yet stale. The
      # generator boots the API server with a stub config — no DB needed.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        run: |
          pnpm contracts:generate
          git diff --exit-code reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md

      - name: Production build
        run: pnpm build:production

      - name: Reliable unit tests
        run: pnpm test:unit

  # The heavy half (Docker image + runtime smoke + prerequisites suite,
  # ~20 min) validates integration, not the PR iteration loop — it runs on
  # main and on demand, while "Quality Gate" stays the required PR check.
  full-suite:
    name: Full Suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Integration validation targets the branch tip: a newer main push
    # supersedes an in-flight Full Suite (that collapse is the minutes diet).
    # Per-commit history comes from Quality Gate above; nightly runs the deep
    # integration suite.
    concurrency:
      group: fs-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Docker image build
        run: docker build --target runtime -t agency_hub_core/runtime:ci .

      - name: Chromium Headless Shell runtime smoke
        run: docker run --rm --entrypoint node agency_hub_core/runtime:ci scripts/smoke-playwright-runtime.mjs

      - name: Sync-critical DB/schema/network tests
        run: pnpm test:prerequisites
