name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Superseded PR heads stop burning runners; main always runs to completion so
# every main commit keeps a finished gate record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the required ruleset context on one runner. Pull requests and manual
  # runs execute the complete gate; pushes to main skip only the integration
  # step already proven before merge. Nightly remains the full-suite backstop.
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager" — one pin, no drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (family standard + architecture walls)
        run: pnpm lint

      # routes.ts freshness: the sdk determinism test pins openapi↔sdk↔hash
      # consistency, but editing routes.ts without `pnpm contracts:generate`
      # kept the committed artifacts mutually consistent yet stale. The
      # generator boots the API server with a stub config — no DB needed.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        run: |
          pnpm contracts:generate
          git diff --exit-code reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md

      - name: Production build
        run: pnpm build:production

      - name: Production Docker image build
        run: docker build --target runtime -t agency_hub_core/runtime:ci .

      - name: Chromium Headless Shell runtime smoke
        run: docker run --rm --entrypoint node agency_hub_core/runtime:ci scripts/smoke-playwright-runtime.mjs

      # NOTE: this step still starts Postgres containers — tests/voice-profiles
      # and tests/voice-notes-sweep are DB-backed despite not being named
      # *.integration.test.ts, so they are not in the --exclude list.
      - name: Reliable unit tests
        run: pnpm test:unit

      # Pull requests must still prove the complete sync-critical selection
      # before merge. Manual runs exercise the same complete gate. Pushes to
      # main skip this duplicate step; nightly remains the full-suite backstop.
      - name: Sync-critical DB/schema/network/API tests
        if: github.event_name != 'push'
        run: pnpm test:sync-critical
