name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Run every gate job even when this tree's fingerprint has already passed"
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR heads stop burning runners; main always runs to completion so
# every main commit keeps a finished Quality Gate record.
concurrency:
  # A PR shares one group per head ref, so a new push cancels the old run. A
  # push or manual run gets a group of its own: GitHub keeps only ONE pending
  # run per group, and a shared ref group let a newer main push evict an
  # older pending one before it ever ran.
  # A metadata-only event — a description edit (no title or base change) or a
  # label other than ci:full — gets its own group so it never cancels the real
  # run for the same head; it still reports "Quality Gate" itself (see the
  # job), so the newest check suite for that head keeps the required check.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}${{ ((github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) || (github.event.action == 'labeled' && github.event.label.name != 'ci:full')) && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Drafts run only admission/gate jobs. Ready PRs and main reuse matching gate
# or DB proofs; a proof miss or lookup error executes the affected checks in
# full. CI never publishes an image: production images build on the server.
#
# Integration scope (owner, 2026-10-18): a PR runs the integration shards only
# when it touches DB, schema/migrations, sync or network code, the integration
# suite or its toolchain (scripts/ci-integration-scope.mjs), or carries the
# label ci:full; otherwise its Quality Gate passes on static checks alone.
# Every push to main runs the whole suite, and main's Quality Gate is what a
# deploy requires (scripts/main-ci-gate.sh).
#
# Runners: GitHub-hosted only (owner, 2026-10-21) — the repository is public,
# so they are free, and a public repository must never reach the owner's PC:
# no job here names a self-hosted label, and none is registered to the repo.
# The gates run on ubuntu-slim, the static parts on ubuntu-24.04 (4 vCPUs
# each), the integration shards on ubuntu-24.04-arm.
#
# Layout of a full run (measured 20.10, ~2.5 min wall): Gate fingerprint
# (~15 s) → five static parts side by side — typecheck, lint, unit 1/2,
# unit 2/2, image — and CI_HOSTED_SHARDS integration shards (default 6,
# scripts/ci-shards.mjs) → Quality Gate.
#
# A pull request whose gate-visible tree equals its base's (prose only: the
# Markdown the fingerprint ignores) runs no static or integration job: its
# Quality Gate passes in seconds and leaves no proof; main runs it in full.
#
# Every push to a ready PR whose change needs integration runs the shards (no
# label to add by hand; ci:full only forces them for a change the scope script
# would skip).
jobs:
  fingerprint:
    name: Gate fingerprint
    if: (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    # ubuntu-slim ships Node.js; these scripts import nothing outside Node.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Artifact lookup and producer validation need actions:read; no writes.
    permissions:
      actions: read
      contents: read
    outputs:
      hash: ${{ steps.fingerprint.outputs.hash }}
      proven_by: ${{ steps.lookup.outputs.proven_by }}
      integration_hash: ${{ steps.fingerprint.outputs.integration_hash }}
      integration_proven_by: ${{ steps.lookup.outputs.integration_proven_by }}
      integration_needed: ${{ steps.scope.outputs.integration_needed }}
      gate_invisible: ${{ steps.fingerprint.outputs.gate_invisible }}
      shards: ${{ steps.shards.outputs.shards }}
      shard_total: ${{ steps.shards.outputs.shard_total }}

    steps:
      # Two commits deep: on a PR, the merge commit GitHub tests and its first
      # parent, the base branch's tip — the integration scope diffs the two.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # The integration matrix: CI_HOSTED_SHARDS (1..8, default 6) shards,
      # capped by what the measured weights need. See scripts/ci-shards.mjs.
      - name: Plan integration shards
        id: shards
        env:
          CI_HOSTED_SHARDS: ${{ vars.CI_HOSTED_SHARDS }}
        run: node scripts/ci-shards.mjs

      # gate_invisible: on a PR, the merge commit's gate-visible tree is its
      # base's (the change is prose the fingerprint ignores), so the static and
      # integration jobs would test exactly what main tests. Anything that
      # cannot be read — no merge commit, no base — is visible.
      - name: Fingerprint the gate-visible tree
        id: fingerprint
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          hash="$(bash scripts/ci-gate-fingerprint.sh)"
          integration_hash="$(bash scripts/ci-gate-fingerprint.sh HEAD integration)"
          [[ "$integration_hash" =~ ^[0-9a-f]{64}$ ]]
          echo "integration_hash=${integration_hash}" >> "$GITHUB_OUTPUT"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${hash}"
          invisible=false
          if [ "$IS_PULL_REQUEST" = true ] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            base_hash="$(bash scripts/ci-gate-fingerprint.sh HEAD^1)" || base_hash=""
            if [ "$base_hash" = "$hash" ]; then
              invisible=true
              echo "The change is invisible to the gate: the gate-visible tree equals the base's."
            fi
          fi
          echo "gate_invisible=${invisible}" >> "$GITHUB_OUTPUT"

      # A PR needs the integration shards only for DB/sync/network changes;
      # push and manual runs, ci:full and anything unreadable always need them.
      - name: Decide whether this PR needs integration
        id: scope
        env:
          SCOPE_EVENT: ${{ github.event_name }}
          SCOPE_FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node scripts/ci-integration-scope.mjs

      - name: Look up earlier passing checks
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
          INTEGRATION_FINGERPRINT: ${{ steps.fingerprint.outputs.integration_hash }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci-find-proof.mjs

  # A full-tree proof skips this job on a PR and on main alike: nothing
  # downstream consumes the image any more, so a tree that already passed is
  # not rebuilt. An integration-only proof never skips it; a PR whose change
  # is invisible to the gate (see the fingerprint job) does.
  #
  # Five parts side by side, each on a 4-vCPU runner of its own:
  #   typecheck  contracts freshness + tsc;
  #   lint       ESLint (family standard + architecture walls);
  #   unit k/2   half of the reliable unit tests (vitest --shard; a couple
  #              start a test Postgres);
  #   image      the production image build (BuildKit with the GitHub Actions
  #              layer cache) and its smokes — no pnpm install: the image
  #              builds from the checkout.
  # The image build trusts the typecheck (CI_TYPECHECK_ALREADY_PASSED) because
  # the Quality Gate needs every part green.
  static:
    name: Static checks (${{ matrix.part }})
    runs-on: ubuntu-24.04
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.gate_invisible != 'true'
    timeout-minutes: 25
    strategy:
      # A PR needs one red part to send the author back; main keeps every
      # part's record.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        part: [typecheck, lint, unit 1/2, unit 2/2, image]
    env:
      # The full workspace type graph exceeds Node 22's default 2 GiB heap.
      # Keep compilation bounded; test scripts retain their own explicit limits.
      NODE_OPTIONS: --max-old-space-size=4096
      IMAGE: agency_hub_core/runtime:ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The unit parts: the test Postgres image downloads while pnpm installs,
      # instead of after it (tests/helpers/global-setup.ts starts it).
      - name: Pull the test Postgres image in the background
        if: startsWith(matrix.part, 'unit')
        run: nohup docker pull --quiet postgres:16 > "$RUNNER_TEMP/postgres-pull.log" 2>&1 &

      # pnpm version comes from package.json "packageManager" — one pin, no
      # drift. The action wipes its install directory first, so it stays in
      # runner.temp.
      - name: Setup pnpm
        if: matrix.part != 'image'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # The pnpm store comes from the Actions cache (the image part installs
      # nothing and restores nothing).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ matrix.part != 'image' && 'pnpm' || '' }}

      - name: Install dependencies
        if: matrix.part != 'image'
        run: pnpm install --frozen-lockfile

      # routes.ts freshness: the sdk determinism test pins openapi↔sdk↔hash
      # consistency, but editing routes.ts without `pnpm contracts:generate`
      # kept the committed artifacts mutually consistent yet stale. The
      # generator boots the API server with a stub config — no DB needed.
      # `git status`, not `git diff`: a NEW generated file is untracked, and
      # `git diff` never lists one, so a generator that adds an SDK module
      # would pass with the module uncommitted.
      - name: Contracts are regenerated (routes.ts ↔ committed artifacts)
        if: matrix.part == 'typecheck'
        run: |
          pnpm contracts:generate
          generated=(reference/agency-hub.openapi.json packages/contracts/src/contract-hash.ts packages/sdk docs/generated/authorization-policy.md)
          drift="$(git status --porcelain --untracked-files=all -- "${generated[@]}")"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            git --no-pager diff -- "${generated[@]}"
            echo "::error::Generated contracts are stale: run pnpm contracts:generate and commit every file it changes or adds."
            exit 1
          fi

      # Check backend types once. Docker explicitly consumes this successful
      # check; direct Docker builds still check.
      - name: Typecheck
        if: matrix.part == 'typecheck'
        run: pnpm typecheck

      - name: Lint (family standard + architecture walls)
        if: matrix.part == 'lint'
        run: pnpm lint

      # NOTE: this step still starts Postgres containers — tests/voice-profiles
      # and tests/voice-notes-sweep are DB-backed despite not being named
      # *.integration.test.ts, so they are not in the --exclude list. One
      # worker per vCPU (vitest defaults to CPUs - 1): the part has the
      # runner to itself.
      - name: Reliable unit tests (${{ matrix.part }})
        if: startsWith(matrix.part, 'unit')
        env:
          PART: ${{ matrix.part }}
        run: pnpm test:unit --maxWorkers="$(nproc)" --shard="${PART#unit }"

      - name: Exact checkout image metadata
        id: metadata
        if: matrix.part == 'image'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          bash scripts/deploy-metadata.sh >> "$GITHUB_OUTPUT"

      # A throwaway BuildKit container backed by the GitHub Actions layer
      # cache (measured 20.10: 165 s cold, 26 s with every layer cached, ~95 s
      # for a source change). The runner is discarded with the job, so the
      # builder is not removed after it (cleanup took 9-17 s).
      - name: Set up Docker Buildx
        id: buildx
        if: matrix.part == 'image'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          cleanup: false

      # Main writes the layer cache, every run reads it: a PR's cache is
      # visible only to that PR, so exporting it (~12 s) bought only its own
      # re-runs. No build summary and no build record artifact: no check reads
      # either.
      - name: Production Docker image build
        if: matrix.part == 'image'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          target: runtime
          load: true
          pull: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_SOURCE_REVISION=${{ steps.metadata.outputs.source_revision }}
            APP_DEPENDENCY_CHECKSUM=${{ steps.metadata.outputs.dependency_checksum }}
            CI_TYPECHECK_ALREADY_PASSED=true
          cache-from: type=gha,scope=hub-runtime-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=hub-runtime-amd64,mode=max,ignore-error=true' || '' }}

      - name: Chromium Headless Shell runtime smoke
        if: matrix.part == 'image'
        run: docker run --rm --entrypoint node "$IMAGE" scripts/smoke-playwright-runtime.mjs

      - name: Native image library smoke
        if: matrix.part == 'image'
        # The AI media describer loads sharp lazily; prove the prebuilt libvips
        # binding for the target platform resolves from the runtime package.
        run: |
          docker run --rm -w /app/apps/runtime --entrypoint node "$IMAGE" \
            --input-type=module -e "const { default: sharp } = await import('sharp'); const out = await sharp({ create: { width: 300, height: 200, channels: 3, background: '#808080' } }).jpeg().toBuffer(); if (out.length < 100) throw new Error('sharp produced no JPEG'); console.log('sharp', sharp.versions.sharp, 'vips', sharp.versions.vips);"

      - name: Startup capability manifest smoke
        if: matrix.part == 'image'
        run: |
          capabilities="$(docker run --rm --entrypoint node "$IMAGE" apps/runtime/dist/startup.js print-public-capabilities)"
          node -e '
            const capabilities = JSON.parse(process.argv[1]);
            if (!Array.isArray(capabilities) || !capabilities.every(value => typeof value === "string")) {
              throw new Error("Public capability manifest must be an array of strings");
            }
            process.stdout.write(JSON.stringify(capabilities) + "\n");
          ' "$capabilities"

  # The sync-critical suite is ~120 database acquisitions over ~104 files and is
  # the whole reason a PR used to wait ~18 minutes. Splitting it across runners
  # is the cheap win: separate machines, each running two files at a time (see
  # the DB step).
  # Since #240 a shard runs ONE cluster and clones a database per acquisition,
  # so "no shared cluster" no longer holds: queries against cluster-global views
  # (pg_locks, pg_stat_activity) must scope themselves to current_database() or
  # a backend pid, and a role is created once for the run (read_only, in
  # tests/helpers/global-setup.ts), by a fixture that tolerates a concurrent
  # creator, or under a name only one file uses. tests/db-isolation-policy.test.ts
  # enforces both.
  # Sharding is by resolved FILE, so it is applied to the
  # :db half directly; `test:prerequisites` is a compound `A && B` and trailing
  # args would land only on B.
  #
  # The files are packed by measured duration, not split by count: the root
  # Vitest config's sequencer reads tests/ci/shard-weights.json and gives
  # shard 1 less file work for the API run it adds. Regenerate the weights
  # from green full runs with scripts/ci-shard-weights.mjs (see its header);
  # a file without a weight takes the median and still runs.
  #
  # The shards run on arm64 (4 vCPUs, free on a public repo): they run only
  # vitest against Testcontainers Postgres (multi-arch) and never build the
  # amd64 image. Testcontainers rather than a service container: a service
  # starts before the steps anyway, and the pull below already overlaps the
  # install; tests/helpers/earnings-audit-psql.ts also execs into the cluster.
  #
  # A PR whose change needs no integration (the fingerprint job's
  # integration_needed is 'false', see scripts/ci-integration-scope.mjs) skips
  # the shards and its Quality Gate passes without them. Only a pull_request
  # event can skip that way: main and manual runs always run them.
  #
  # The fingerprint job plans the shard count: the repository variable
  # CI_HOSTED_SHARDS (1..8, default 6), capped by what the measured weights
  # need. "Re-run failed jobs" reuses the first attempt's plan, so a re-run leg
  # keeps its shard total. The fallbacks below only keep fromJSON off an empty
  # string; this job cannot run unless the fingerprint job succeeded and set
  # both outputs.
  integration:
    name: Integration ${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 6 }}
    runs-on: ubuntu-24.04-arm
    needs: [fingerprint]
    if: github.event.pull_request.draft != true && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.integration_proven_by == '' && needs.fingerprint.outputs.gate_invisible != 'true' && (github.event_name != 'pull_request' || needs.fingerprint.outputs.integration_needed != 'false')
    # 30 stopped fitting on 2026-08-17: vitest --shard then split by FILE
    # COUNT, not duration, and after a week that added four integration files
    # one shard drew a slow-heavy set and was cancelled at 30:18 with every
    # test green (the #80 merge push on main was cancelled the same way). 45
    # lets the existing gate FINISH — it does not weaken it, and a healthy run
    # spends nothing extra.
    timeout-minutes: 45
    strategy:
      # A PR needs one red shard to send the author back; the others would
      # bill ~10 minutes each to say the same thing. Main keeps the complete
      # record of every shard for its gate history.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: ${{ fromJSON(needs.fingerprint.outputs.shards || '[1,2,3,4,5,6]') }}

    # Checkout, pnpm and the install as in static checks.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The test Postgres image downloads while pnpm installs, instead of
      # after it, when global-setup starts the cluster.
      - name: Pull the test Postgres image in the background
        run: nohup docker pull --quiet postgres:16 > "$RUNNER_TEMP/postgres-pull.log" 2>&1 &

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A shard runs its files two at a time (the script's default is
      # --no-file-parallelism, one at a time): each file still clones its own
      # database from the shard's one cluster, and anything cluster-wide in
      # those files is scoped or created once in tests/helpers/global-setup.ts.
      # Two on the owner's PC since 01.10, and on a 4-vCPU hosted runner.
      #
      # The shard's test cluster keeps PGDATA in a tmpfs (HUB_TEST_PG_TMPFS,
      # tests/helpers/global-setup.ts): the cluster is thrown away with the run,
      # fsync is already off, and on disk its WAL and cloned databases were
      # ~8 GiB of writes a full run, most of the PC's SSD wear (measured 01.10:
      # 8.1-8.4 GiB a run on disk, 2.1 GiB with the tmpfs, no slower, peak
      # cluster ~270 MiB a shard); a 16 GB hosted runner holds it easily.
      # The Nightly full suite keeps it on disk.
      - name: Sync-critical DB/schema/network tests (shard ${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 6 }})
        env:
          SYNC_CRITICAL_DB_PARALLELISM: --fileParallelism --maxWorkers=2
          HUB_TEST_PG_TMPFS: "1"
        run: pnpm test:sync-critical:db --shard=${{ matrix.shard }}/${{ needs.fingerprint.outputs.shard_total || 6 }}

      # One file, ~20s on the PC — it resolves to a single spec so it cannot
      # be sharded; the weights' firstShardExtraSeconds accounts for it.
      - name: Sync-critical API tests
        if: matrix.shard == 1
        env:
          HUB_TEST_PG_TMPFS: "1"
        run: pnpm test:sync-critical:api

  # Branch protection requires a check named exactly "Quality Gate". A matrix
  # job publishes "Integration 1/3", "Integration 2/3", … which would satisfy
  # nothing, so this aggregator keeps the required name and fails unless every
  # dependency succeeded. `if: always()` is required — without it a skipped
  # aggregator reports success to the ruleset.
  #
  # With a proven fingerprint the test jobs are skipped by design and the gate
  # passes on the earlier run's evidence; a fingerprint job that failed leaves
  # `proven_by` empty, so every skip that is NOT backed by a proof still fails.
  # The one other skip that
  # passes is a PR whose change needs no integration (INTEGRATION_NEEDED is
  # false only on a pull_request event): its static checks must still pass,
  # and it publishes no full-tree proof, so main runs integration for it.
  # And a PR whose change is invisible to the gate (GATE_INVISIBLE, only on a
  # pull_request event) skips both: it tests nothing its base does not, and
  # publishes no proof.
  #
  # The name is the literal "Quality Gate" in every event and the job runs in
  # every event. GitHub resolves a required check against the NEWEST check
  # suite for the head SHA, so a run that renames or skips this job takes the
  # gate off that head and the PR becomes unmergeable with every check green
  # (Decision 377). A metadata-only event therefore still runs this job and
  # mirrors the verdict of the NEWEST gate another real run recorded for the
  # same SHA (scripts/ci-mirror-gate.mjs): a newer red gate beats an older
  # green one, and a missing gate stays red. Its own run is the newest suite,
  # so whatever it reports stands until the next event: while a real run on
  # the head is still working, it waits for that verdict (MIRROR_WAIT_MS,
  # then red) rather than repeating an older one.
  #
  quality:
    name: Quality Gate
    runs-on: ubuntu-slim
    needs: [fingerprint, static, integration]
    if: always()
    # The mirror's wait for a real run on the same head plus setup; the
    # aggregating path takes seconds.
    timeout-minutes: 45
    # Reading this head's workflow runs and earlier check runs on a private
    # repository needs actions:read and checks:read. Nothing in this job writes.
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      # A metadata-only event: a description edit (no code, no title, no base)
      # or a label other than ci:full — and, by their own conditions, no gate
      # jobs to aggregate.
      METADATA_ONLY: ${{ (github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base) || (github.event.action == 'labeled' && github.event.label.name != 'ci:full') }}

    steps:
      - name: Checkout
        if: env.METADATA_ONLY == 'true'
        uses: actions/checkout@v6

      - name: An earlier run already passed this head
        if: env.METADATA_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-mirror-gate.mjs

      - name: Every gate job succeeded
        if: env.METADATA_ONLY != 'true'
        env:
          PROVEN_BY: ${{ needs.fingerprint.outputs.proven_by }}
          INTEGRATION_PROVEN_BY: ${{ needs.fingerprint.outputs.integration_proven_by }}
          FINGERPRINT_RESULT: ${{ needs.fingerprint.result }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.hash }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          STATIC: ${{ needs.static.result }}
          INTEGRATION: ${{ needs.integration.result }}
          INTEGRATION_NEEDED: ${{ github.event_name != 'pull_request' || needs.fingerprint.outputs.integration_needed != 'false' }}
          GATE_INVISIBLE: ${{ github.event_name == 'pull_request' && needs.fingerprint.outputs.gate_invisible == 'true' }}
        run: |
          [ "$IS_DRAFT" != "true" ] || { echo "Draft PR: mark ready for review to run checks."; exit 1; }
          [ "$FINGERPRINT_RESULT" = "success" ] || exit 1
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || exit 1
          if [ -n "$PROVEN_BY" ]; then
            [ "$INTEGRATION" = "skipped" ] || exit 1
            case "$STATIC" in success|skipped) ;; *) exit 1 ;; esac
            echo "Quality Gate reused run ${PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GATE_INVISIBLE" = "true" ]; then
            [ "$STATIC" = "skipped" ] || exit 1
            [ "$INTEGRATION" = "skipped" ] || exit 1
            echo "The change is invisible to the gate (prose only): nothing to test that the base does not; main runs it in full." >> "$GITHUB_STEP_SUMMARY"
          else
            [ "$STATIC" = "success" ] || exit 1
            if [ -n "$INTEGRATION_PROVEN_BY" ]; then
              [ "$INTEGRATION" = "skipped" ] || exit 1
              echo "Static checks fresh; integration reused run ${INTEGRATION_PROVEN_BY}." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$INTEGRATION_NEEDED" = "false" ]; then
              [ "$INTEGRATION" = "skipped" ] || exit 1
              echo "Static checks fresh; this change needs no integration on the PR (main runs it)." >> "$GITHUB_STEP_SUMMARY"
            else
              [ "$INTEGRATION" = "success" ] || exit 1
              echo "All checks ran fresh." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Record this fingerprint as proven
        if: env.METADATA_ONLY != 'true' && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.gate_invisible != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/quality-gate"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/quality-gate/run-id"

      # A full-tree proof needs integration evidence: a PR that skipped the
      # shards as out of scope publishes none, so main runs them for its tree.
      - name: Publish the proof for later identical trees
        if: env.METADATA_ONLY != 'true' && needs.fingerprint.outputs.proven_by == '' && needs.fingerprint.outputs.gate_invisible != 'true' && (needs.integration.result == 'success' || needs.fingerprint.outputs.integration_proven_by != '')
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-${{ needs.fingerprint.outputs.hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish fresh integration proof
        if: needs.integration.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: integration-gate-${{ needs.fingerprint.outputs.integration_hash }}
          path: ${{ runner.temp }}/quality-gate/run-id
          if-no-files-found: error
          retention-days: 30
          overwrite: true
