<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The font set "croscore": base with Croscore.
     page.sh gives it to a page (its fonts option); s6-rc.d/chrome/run puts
     it at /etc/fonts/local.conf before Chrome starts. Every font file is
     rejected but those accepted here (an accept wins over a reject): a
     font the image gains later shows in no set until one accepts it. No
     double dash in a comment: fontconfig would skip the whole file. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <!-- Every file with a dot in its name: every font file, and no
           directory fontconfig must walk to reach those accepted. -->
      <glob>/*.*</glob>
    </rejectfont>
    <acceptfont>
      <!-- fonts-liberation: Google Chrome's own dependency, in every set -->
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <!-- fonts-dejavu-core -->
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
      <!-- fonts-noto-core, fonts-noto-color-emoji -->
      <glob>/usr/share/fonts/truetype/noto/*</glob>
      <!-- fonts-croscore: Arimo, Tinos, Cousine, which fontconfig takes for
           Arial, Times New Roman and Courier New before Liberation -->
      <glob>/usr/share/fonts/truetype/croscore/*</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
