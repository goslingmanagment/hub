# The stand of stage 1 (plan §5): our own servers instead of Fansly. The
# network is internal — nothing on it reaches the internet. Run from the
# worktree root:
#   docker compose -f apps/page-browser/stand/docker-compose.yml up -d --build
# A second stand beside it (development while a series runs):
#   STAND_NET=10.250.251 docker compose -p pb-dev -f … up -d
# PB_SRC points the containers at a frozen copy of apps/page-browser.
name: pb-stand

networks:
  stand:
    internal: true
    ipam:
      config:
        - subnet: ${STAND_NET:-10.250.250}.0/24

volumes:
  ca: {}

services:
  stand-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ${PB_SERVER_IMAGE:-pb-stand-server}
    networks:
      stand:
        ipv4_address: ${STAND_NET:-10.250.250}.10
    volumes:
      - ca:/stand/ca
      - ${PB_SRC:-..}/stand/pages:/stand/pages:ro
    environment:
      STAND_SOCKS_USER: pb
      STAND_SOCKS_PASS: pb-secret

  browser:
    image: ${PB_IMAGE:-pb-browser}
    depends_on: [stand-server]
    networks:
      stand:
        ipv4_address: ${STAND_NET:-10.250.250}.20
    cap_add: [NET_ADMIN]
    # PROTOTYPE: Chrome's sandbox needs user namespaces, which Docker's
    # default seccomp profile forbids; production gets a Chrome seccomp
    # profile instead (plan §3.1). --no-sandbox is never used.
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    volumes:
      - ca:/stand/ca:ro
      # The prototype's code is mounted: an edit needs a restart, not a build.
      - ${PB_SRC:-..}/src:/opt/page-browser/src:ro
      - ${PB_SRC:-..}/docker:/opt/page-browser/docker:ro
    environment:
      PB_SOCKS_HOST: ${STAND_NET:-10.250.250}.10
      PB_SOCKS_PORT: "1080"
      PB_SOCKS_USER: pb
      PB_SOCKS_PASS: pb-secret
      PB_RPC_FROM: ${STAND_NET:-10.250.250}.0/24
      PB_RPC_TOKEN: stand-token
      PB_STAND: "1"
      PB_FAST_RETRY: "1"
      PB_WAIT_CA: "1"
      PB_RUNTIME_ENABLE: "1"

      PB_DEBUG_FETCH: "${PB_DEBUG:-0}"
      PB_DEBUG_NET: "${PB_DEBUG:-0}"
      PB_DEBUG_CDP: "${PB_DEBUG:-0}"
      PB_DEBUG_RECORDS: "${PB_DEBUG_RECORDS:-0}"
      PB_HALT_ON_ENGINE_LOSS: "${PB_HALT_ON_ENGINE_LOSS:-0}"
      PB_ON_BLOCKED_SEND: log
      PB_SELFTEST_RULES: "${PB_SELFTEST_RULES:-1}"
      PB_TZ: "${PB_TZ:-UTC}"
      PB_LANG: "${PB_LANG:-en-US}"
      PB_GEO: "${PB_GEO:-}"
      PB_CHROME_ARGS: "${PB_CHROME_ARGS:---ignore-gpu-blocklist}"

  runner:
    image: node:22-bookworm-slim
    depends_on: [browser]
    working_dir: /pb
    networks:
      stand:
        ipv4_address: ${STAND_NET:-10.250.250}.30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PB_SRC:-..}:/pb:ro
      - ./results:/stand/results
    environment:
      STAND_OPERATOR: ws://${STAND_NET:-10.250.250}.20:7700/rpc
      STAND_SERVER: ${STAND_NET:-10.250.250}.10
      STAND_NAME: ${COMPOSE_PROJECT_NAME:-pb-stand}
      STAND_BROWSER_CONTAINER: ${COMPOSE_PROJECT_NAME:-pb-stand}-browser-1
    command: ["sleep", "infinity"]
