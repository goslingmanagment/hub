# Project Browser — the browser container of one Fansly page (plan §3.1;
# stage 3, PR 2). A Compose project of its own per page
# (`page-browser-<page>`), apart from Hub's stack: a Hub deploy never touches
# it, and the site's socket and the operator's buffer outlive one.
#
# Only scripts/deploy-page-browser.sh creates, recreates and removes these
# containers, over SSH from the workstation, with the page's env file
# (/opt/agency-hub/page-browser/pages/<page>/page.env). It also creates
# what this file takes as given: the networks pb-control and pb-egress, the
# page's profile and buffer volumes, its secrets, the seccomp and AppArmor
# profiles.
#
# - pb-control (internal): the engine (`sync`) and the API reach the
#   operator's RPC and the owner's screen here; Hub's own containers join it
#   with fixed addresses (PR 3).
# - pb-egress: the way out, to the page's SOCKS5 only — the container's own
#   nftables rules (init-net) and the host's DOCKER-USER rules both hold it
#   there. No port is published.
name: page-browser-${PB_PAGE:?the page}

services:
  browser:
    image: ${PB_IMAGE:?the image tag}
    container_name: page-browser-${PB_PAGE}
    # The profile's own host name: Chrome's profile lock names the host, so
    # a recreated container — or the profile on another page — takes over
    # the lock of a Chrome that is gone instead of taking the profile for
    # another machine's (stage 1, amendment 33). page.sh never lets two
    # containers mount one profile.
    hostname: pb-${PB_PROFILE_ID}
    restart: unless-stopped
    stop_grace_period: 20s
    # Bounded like Hub's own services (docker-compose.production.yml): the
    # operator writes a line per passed site request, and Chrome and KasmVNC
    # write to the same stream. Without a cap the daemon default (json-file,
    # unrotated) grows for the container's whole life. `local` compresses
    # rotated files; the facts stay in Hub's journal, not in this log.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      pb-control:
        ipv4_address: ${PB_CONTROL_IP:?the address in pb-control}
      pb-egress:
        ipv4_address: ${PB_EGRESS_IP:?the address in pb-egress}
    # Root keeps what init-net and s6 need; Chrome, the X server and the
    # operator run as their own users without capabilities.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_ADMIN]
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile plus what Chrome's sandbox needs
      # (apps/page-browser/security/seccomp-chrome.json).
      - seccomp=${PB_SECCOMP_PROFILE:?the seccomp profile path}
      # Docker's default AppArmor profile plus user namespaces
      # (apps/page-browser/security/apparmor-page-browser).
      - apparmor=${PB_APPARMOR_PROFILE:-page-browser}
    # Chrome crashes with a small /dev/shm. Preliminary limits (plan §4.12).
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1
    pids_limit: 1024
    environment:
      PB_PAGE: ${PB_PAGE}
      PB_PROFILE_ID: ${PB_PROFILE_ID:?the profile id}
      # The operator's RPC listens on this address only.
      PB_CONTROL_IP: ${PB_CONTROL_IP}
      PB_SOCKS_IP: ${PB_SOCKS_IP:?the SOCKS5 address}
      PB_SOCKS_PORT: ${PB_SOCKS_PORT:?the SOCKS5 port}
      PB_SYNC_IP: ${PB_SYNC_IP:?the address of sync in pb-control}
      PB_API_IP: ${PB_API_IP:?the address of api in pb-control}
      # Chrome's time zone and language until the engine's hello brings the
      # page's own (plan §4.1, step 2; apps/page-browser/src/env/).
      PB_TZ: ${PB_TZ:-UTC}
      PB_LANG: ${PB_LANG:-en-US}
    secrets:
      - vnc_password
      - rpc_token
      - api_token
    volumes:
      - profile:/data/profile
      - buffer:/data/buffer
    labels:
      agency-hub.page-browser.page: ${PB_PAGE}
      agency-hub.page-browser.profile: ${PB_PROFILE_ID}

networks:
  pb-control:
    external: true
  pb-egress:
    external: true

# Named by the profile, not the page: a profile that is ready moves to
# another page without a copy (plan §3.1).
volumes:
  profile:
    external: true
    name: pb-profile-${PB_PROFILE_ID}
  buffer:
    external: true
    name: pb-buffer-${PB_PROFILE_ID}

# The owner's screen password; the page's RPC token, which the engine's
# hello must carry (plan §4.13); the API's own token, which every call of
# the login form carries (plan §4.8, PR 15). All three are made by page.sh,
# root's alone; Hub keeps the same three sealed (page_browsers).
secrets:
  vnc_password:
    file: ${PB_SECRETS_DIR:?the page's secrets directory}/vnc_password
  rpc_token:
    file: ${PB_SECRETS_DIR:?the page's secrets directory}/rpc_token
  api_token:
    file: ${PB_SECRETS_DIR:?the page's secrets directory}/api_token
