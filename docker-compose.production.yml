x-production-logging: &production-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    logging: *production-logging
    # Keep slow-query SQL/durations, but never log bind values (error canon).
    # Command-line settings override auto.conf; all other VPS tuning stays there.
    command: ["postgres", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    # Give Postgres time for a fast shutdown at recreate; Docker's default 10s
    # can SIGKILL a checkpointing 55 GB cluster into crash recovery.
    stop_grace_period: 60s
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agency_hub_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    image: ${RUNTIME_IMAGE:-agency_hub_core/runtime:production}
    logging: *production-logging
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # E7/D8-N1 (W3): every naive Date parse must stay UTC even if a future
      # base image ships a local timezone.
      TZ: UTC
    command: ["node", "apps/runtime/dist/startup.js", "api"]
    volumes:
      - ${OFAPI_EXPORT_ARTIFACT_HOST_DIR:?Set OFAPI_EXPORT_ARTIFACT_HOST_DIR to an absolute host path in .env.production}:${OFAPI_EXPORT_ARTIFACT_DIR:-/var/lib/agency-hub/ofapi-export-artifacts}:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.API_PORT || '3000'; fetch('http://127.0.0.1:' + port + '/api/v1/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Stage 25: cron registration + firing live in the scheduler role
  # (leader-elected via a session advisory lock). One active instance is
  # required; add a second `scheduler-standby` entry for a hot standby — same
  # definition MINUS the healthcheck and SCHEDULER_HEALTH_FILE (a standby
  # idles on the lock and never heartbeats, so the check would flag it).
  scheduler:
    image: ${RUNTIME_IMAGE:-agency_hub_core/runtime:production}
    logging: *production-logging
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SCHEDULER_HEALTH_FILE: /tmp/agency-hub-scheduler-health.json
      TZ: UTC
    command: ["node", "apps/runtime/dist/startup.js", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    # The heartbeat refreshes the file only AFTER a successful DB upsert (60s
    # cadence), so mtime freshness certifies the event loop and a DB
    # round-trip together — no separate DB probe needed here.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs = require('node:fs'); const file = process.env.SCHEDULER_HEALTH_FILE || '/tmp/agency-hub-scheduler-health.json'; const stat = fs.statSync(file); if (Date.now() - stat.mtimeMs > 150000) throw new Error('stale scheduler health file');",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Scale-out (Stage 25 Task 4): duplicate this service as worker-2 with the
  # same definition (distinct WORKER_HEALTH_FILE) when the prod rollout goes
  # to two workers — job coordination is singleton-key/lock based, no other
  # config changes needed.
  worker:
    image: ${RUNTIME_IMAGE:-agency_hub_core/runtime:production}
    logging: *production-logging
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WORKER_HEALTH_FILE: /tmp/agency-hub-worker-health.json
      TZ: UTC
    command: ["node", "apps/runtime/dist/startup.js", "worker"]
    volumes:
      - ${OFAPI_EXPORT_ARTIFACT_HOST_DIR:?Set OFAPI_EXPORT_ARTIFACT_HOST_DIR to an absolute host path in .env.production}:${OFAPI_EXPORT_ARTIFACT_DIR:-/var/lib/agency-hub/ofapi-export-artifacts}:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs = require('node:fs'); const { Client } = require('./apps/runtime/node_modules/pg'); const file = process.env.WORKER_HEALTH_FILE || '/tmp/agency-hub-worker-health.json'; const stat = fs.statSync(file); if (Date.now() - stat.mtimeMs > 90000) throw new Error('stale worker health file'); const client = new Client({ connectionString: process.env.DATABASE_URL }); client.connect().then(() => client.query('select 1')).then(() => client.end()).catch((error) => { console.error(error); process.exit(1); });",
        ]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
