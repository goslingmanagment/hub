services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agency_hub_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agency_hub_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build: .
    image: agency_hub_core/runtime:local
    command: ["node", "packages/db/dist/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
      SYNC_SHARED_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: agency_hub_core/runtime:local
    command: ["node", "apps/runtime/dist/startup.js", "api"]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
      SYNC_SHARED_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    image: agency_hub_core/runtime:local
    command: ["node", "apps/runtime/dist/startup.js", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
      SYNC_SHARED_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
