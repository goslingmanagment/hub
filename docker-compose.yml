services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fansly_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: ["pnpm", "api"]
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres

  worker:
    build: .
    env_file: .env
    depends_on:
      - postgres

volumes:
  postgres_data:
