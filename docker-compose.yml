x-local-logging: &local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    logging: *local-logging
    environment:
      POSTGRES_DB: agency_hub_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agency_hub_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build: .
    image: agency_hub_core/runtime:local
    logging: *local-logging
    command: ["node", "packages/db/dist/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: agency_hub_core/runtime:local
    logging: *local-logging
    command: ["node", "apps/runtime/dist/startup.js", "api"]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    image: agency_hub_core/runtime:local
    logging: *local-logging
    command: ["node", "apps/runtime/dist/startup.js", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # The Fansly Sync Engine's process, as in docker-compose.production.yml.
  sync:
    image: agency_hub_core/runtime:local
    logging: *local-logging
    stop_grace_period: 45s
    command: ["node", "apps/runtime/dist/startup.js", "sync"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agency_hub_core
      SYNC_HEALTH_FILE: /tmp/agency-hub-sync-health.json
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
