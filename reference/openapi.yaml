# ════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════
components:
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: authorization
      description: Raw auth token (no Bearer prefix)
    clientId:
      type: apiKey
      in: header
      name: fansly-client-id
      description: Client identifier (injected by Fansly app)
    clientCheck:
      type: apiKey
      in: header
      name: fansly-client-check
      description: Client integrity check (injected by Fansly app)
    clientTs:
      type: apiKey
      in: header
      name: fansly-client-ts
      description: Current timestamp in ms
    sessionId:
      type: apiKey
      in: header
      name: fansly-session-id
      description: Session identifier

  parameters:
    NgswBypass:
      name: ngsw-bypass
      in: query
      description: Bypass Angular service worker caching
      schema:
        type: boolean
        default: true
    Limit100:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    Before:
      name: before
      in: query
      description: Pagination cursor (ID or timestamp)
      schema:
        type: string
        default: "0"
    After:
      name: after
      in: query
      description: Forward pagination cursor
      schema:
        type: string
        default: "0"
    BeforeTimestamp:
      name: before
      in: query
      description: End timestamp (ms)
      schema:
        type: string
    AfterTimestamp:
      name: after
      in: query
      description: Start timestamp (ms)
      schema:
        type: string

  schemas:
    # ── Base response ──
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

    # ── Generic wrappers ──
    ApiResponse_GenericObject:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: object

    ApiResponse_GenericArray:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: array
          items:
            type: object

    # ── Account responses ──
    ApiResponse_AccountMe:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: object
          properties:
            account:
              $ref: '#/components/schemas/Account'
            wallets:
              type: array
              items:
                $ref: '#/components/schemas/Wallet'
            subscriptionTiers:
              type: array
              items:
                type: object

    ApiResponse_AccountArray:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    ApiResponse_WallArray:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: array
          items:
            $ref: '#/components/schemas/Wall'

    ApiResponse_WalletArray:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'

    # ── Follower response ──
    ApiResponse_Followers:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: object
          properties:
            followers:
              type: array
              items:
                $ref: '#/components/schemas/Follower'
            aggregationData:
              $ref: '#/components/schemas/AggregationData'

    # ── Messaging responses ──
    ApiResponse_MessagingGroups:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Group'
            aggregationData:
              $ref: '#/components/schemas/AggregationData'

    ApiResponse_Group:
      type: object
      properties:
        success:
          type: boolean
        response:
          $ref: '#/components/schemas/Group'

    ApiResponse_Messages:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
            accountMedia:
              type: array
              items:
                type: object
            accountMediaBundles:
              type: array
              items:
                type: object
            tips:
              type: array
              items:
                type: object
            tipGoals:
              type: array
              items:
                type: object
            accountMediaOrders:
              type: array
              items:
                type: object
            stories:
              type: array
              items:
                type: object
            storyOrders:
              type: array
              items:
                type: object

    # ── Subscriber response ──
    ApiResponse_Subscribers:
      type: object
