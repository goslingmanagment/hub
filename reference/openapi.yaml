openapi: 3.0.3
info:
  title: Fansly API
  description: |
    Reverse-engineered Fansly API specification.

    ## Key conventions
    - All IDs are string-encoded 64-bit integers (e.g. `"737077689877278720"`)
    - Wallet balances are in **cents** (divide by 100 for USD)
    - Earnings/transactions are in **mills** (divide by 1000 for USD)
    - Timestamps are in **milliseconds** (Unix epoch), except `Post.createdAt` which is in **seconds**
    - All GET requests include `ngsw-bypass=true` query parameter to bypass Angular service worker caching
    - The `authorization` header uses a raw token (no `Bearer` prefix)
  version: "1.0.0"
  contact:
    name: Reverse Engineering Project

servers:
  - url: https://apiv3.fansly.com/api/v1
    description: Main REST API
  - url: https://mediav2.fansly.com/api/v1
    description: Media Upload API

security:
  - authToken: []

tags:
  - name: Account
    description: Account management and lookup
  - name: Messaging
    description: Direct messages and conversations
  - name: Subscribers
    description: Creator subscriber management
  - name: Subscriptions
    description: User subscription management
  - name: Followers
    description: Follower management
  - name: Posts
    description: Post creation and retrieval
  - name: Timeline
    description: Timeline/feed endpoints
  - name: Media
    description: Media objects and account media
  - name: Vault
    description: Media vault and album management
  - name: Earnings
    description: Earnings, wallets, and payments
  - name: Notifications
    description: Notification management
  - name: Settings
    description: Account settings
  - name: Analytics
    description: Statistics and analytics
  - name: Lists
    description: Custom user lists
  - name: Ignore
    description: Block/mute management
  - name: Notes
    description: User notes
  - name: MediaUpload
    description: Media upload (mediav2.fansly.com)
  - name: Streaming
    description: Livestreaming and chatrooms
  - name: ContentDiscovery
    description: Content discovery and suggestions
  - name: Utilities
    description: Versioning, products, tracking links

paths:
  # ──────────────────────────────────────────────
  # Account
  # ──────────────────────────────────────────────
  /account/me:
    get:
      operationId: getMyAccount
      summary: Get authenticated user's account
      tags: [Account]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
          description: Current user account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AccountMe'
              example:
                success: true
                response:
                  account:
                    id: "772956494390898689"
                    username: "example_user"
                    displayName: "Example User"
                    flags: 50
                    version: 17
                    createdAt: 1745781549000
                    followCount: 474
                    subscriberCount: 6
                    timelineStats:
                      imageCount: 78
                      videoCount: 5
                      bundleCount: 15
                    statusId: 3
                    accountMediaLikes: 2249
                    postLikes: 730
                  wallets:
                    - id: "775700594068299776"
                      balance: 153792
                      type: 2
                  subscriptionTiers: []

  /account:
    get:
      operationId: getAccounts
      summary: Get accounts by IDs or usernames
      description: Batch limit 100 per request.
      tags: [Account]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: ids
          in: query
          description: Comma-separated account IDs (max 100)
          schema:
            type: string
        - name: usernames
          in: query
          description: Comma-separated usernames (case-insensitive)
          schema:
            type: string
      responses:
        '200':
          description: Array of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AccountArray'

  /account/search:
    get:
      operationId: searchAccounts
      summary: Search for accounts
      tags: [Account]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: query
          in: query
          required: true
          description: URL-encoded search term
          schema:
            type: string
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_AccountArray'

  /account/walls:
    get:
      operationId: getAccountWalls
      summary: Get account walls/timelines
      tags: [Account]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: correlationPostIds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Array of wall objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WallArray'

  /account/{accountId}/wallets:
    get:
      operationId: getAccountWallets
      summary: Get wallets for an account
      tags: [Account]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WalletArray'

  /account/ignore:
    post:
      operationId: ignoreAccount
      summary: Block or ignore an account
      tags: [Ignore]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ignoredId, ignoreFlags]
              properties:
                ignoredId:
                  type: string
                  description: Account ID to ignore
                ignoreFlags:
                  type: integer
                  description: Bitmask (1=mute, 2=block, 4=vip, 8=suggestion_mute, 16=dm_bypass)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /account/media:
    get:
      operationId: getAccountMedia
      summary: Get account media by IDs
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: ids
          in: query
          required: true
          description: Comma-separated account media IDs
          schema:
            type: string
      responses:
        '200':
          description: Array of account media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericArray'
    post:
      operationId: createAccountMedia
      summary: Create account media (link uploaded media to account)
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  mediaId:
                    type: string
                  previewId:
                    type: string
                    nullable: true
                  permissionFlags:
                    type: integer
                    default: 0
                  price:
                    type: integer
                    default: 0
                  whitelist:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: object
                    properties:
                      permissionFlags:
                        type: array
                        items:
                          type: integer
                  tags:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: Created account media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericArray'

  /account/media/bundle:
    get:
      operationId: getAccountMediaBundles
      summary: Get account media bundles by IDs
      tags: [Media]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: ids
          in: query
          required: true
          description: Comma-separated bundle IDs
          schema:
            type: string
      responses:
        '200':
          description: Array of media bundles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericArray'
    post:
      operationId: createAccountMediaBundle
      summary: Create a media bundle
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Created bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /account/media/permissions:
    post:
      operationId: editMediaPermissions
      summary: Edit permissions for a single account media item
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, mediaId]
              properties:
                id:
                  type: string
                  description: Account media ID
                mediaId:
                  type: string
                previewId:
                  type: string
                  nullable: true
                permissionFlags:
                  type: integer
                price:
                  type: integer
                whitelist:
                  type: array
                  items:
                    type: string
                permissions:
                  type: object
                  properties:
                    permissionFlags:
                      type: array
                      items:
                        type: integer
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /account/media/bundle/permissions:
    post:
      operationId: editBundlePermissions
      summary: Edit permissions for a media bundle
      tags: [Media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Bundle ID
                previewId:
                  type: string
                  nullable: true
                permissionFlags:
                  type: integer
                price:
                  type: integer
                accountMediaModels:
                  type: array
                  items:
                    type: object
                whitelist:
                  type: array
                  items:
                    type: string
                permissions:
                  type: object
                  properties:
                    permissionFlags:
                      type: array
                      items:
                        type: integer
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  # ──────────────────────────────────────────────
  # Followers
  # ──────────────────────────────────────────────
  /account/{accountId}/followersnew:
    get:
      operationId: getFollowers
      summary: Get followers for an account
      tags: [Followers]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - name: search
          in: query
          description: Filter by username
          schema:
            type: string
        - name: lastSeenAfter
          in: query
          description: Filter by last seen timestamp (ms)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Followers list with aggregation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Followers'

  # ──────────────────────────────────────────────
  # Messaging
  # ──────────────────────────────────────────────
  /messaging/groups:
    get:
      operationId: getMessagingGroups
      summary: List DM conversation groups
      tags: [Messaging]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - $ref: '#/components/parameters/Offset'
        - name: sortOrder
          in: query
          description: "Sort order (0 or 1)"
          schema:
            type: integer
            default: 1
        - name: flags
          in: query
          description: "Filter flags (0=all, 32=unread only)"
          schema:
            type: integer
            default: 0
        - name: search
          in: query
          description: Username search query
          schema:
            type: string
        - name: subscriptionTierId
          in: query
          description: Filter by subscription tier
          schema:
            type: string
        - name: listIds
          in: query
          description: Comma-separated list IDs
          schema:
            type: string
      responses:
        '200':
          description: Conversation groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MessagingGroupsList'

  /group:
    post:
      operationId: createGroup
      summary: Create a new DM conversation group
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users, type]
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                      permissionFlags:
                        type: integer
                        default: 0
                recipients:
                  type: array
                  items:
                    type: object
                lastMessage:
                  nullable: true
                userSettings:
                  nullable: true
                type:
                  type: integer
                  description: "1 = DM"
                  default: 1
      responses:
        '200':
          description: Created group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Group'

  /group/{groupId}:
    get:
      operationId: getGroup
      summary: Get a specific conversation group
      tags: [Messaging]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Group'

  /message:
    get:
      operationId: getMessages
      summary: Get messages in a conversation
      tags: [Messaging]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: groupId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: before
          in: query
          description: Message ID cursor (get messages before this)
          schema:
            type: string
      responses:
        '200':
          description: Messages with related data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Messages'
    post:
      operationId: sendMessage
      summary: Send a message
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, content, type]
              properties:
                type:
                  type: integer
                  default: 1
                groupId:
                  type: string
                content:
                  type: string
                attachments:
                  type: array
                  items:
                    type: object
                likes:
                  type: array
                  items:
                    type: object
                scheduledFor:
                  type: integer
                  default: 0
                inReplyTo:
                  type: string
                  nullable: true
                createdAt:
                  type: integer
                  format: int64
                  description: Timestamp in ms
      responses:
        '200':
          description: Sent message
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    properties:
                      id:
                        type: string

  /message/ack:
    post:
      operationId: acknowledgeMessages
      summary: Mark messages as read
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageIds, type]
              properties:
                messageIds:
                  type: array
                  items:
                    type: string
                type:
                  type: integer
                  description: "2 = read acknowledgment"
                  default: 2
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /message/typing:
    post:
      operationId: sendTypingIndicator
      summary: Send typing indicator
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /message/unread:
    get:
      operationId: getUnreadMessages
      summary: Get unread message summary
      tags: [Messaging]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Unread messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericObject'

  /message/delete:
    post:
      operationId: deleteMessage
      summary: Delete a message
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, id]
              properties:
                messageId:
                  type: string
                id:
                  type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /message/automated:
    get:
      operationId: getAutomatedMessages
      summary: Get configured automated messages
      tags: [Messaging]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
          description: Automated message configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutomatedMessage'

  /message/broadcast:
    post:
      operationId: broadcastMessage
      summary: Send a mass direct message
      tags: [Messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Broadcast sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  # ──────────────────────────────────────────────
  # Subscribers (Creator)
  # ──────────────────────────────────────────────
  /subscribers:
    get:
      operationId: getSubscribers
      summary: Get subscriber list (for creators)
      tags: [Subscribers]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: status
          in: query
          description: "Comma-separated status codes (e.g. 3,4)"
          schema:
            type: string
            default: "3,4"
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Offset'
        - name: search
          in: query
          description: Username search
          schema:
            type: string
        - name: subscriptionTierId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Subscribers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Subscribers'
              example:
                success: true
                response:
                  stats:
                    totalActive: 6
                    totalExpired: 7
                    total: 13
                  subscriptions:
                    - id: "883584485138907136"
                      subscriberId: "586780754529234944"
                      subscriptionTierId: "877260451656769536"
                      subscriptionTierName: "Premium"
                      status: 3
                      price: 20000
                      renewPrice: 20000
                      autoRenew: 1
                      billingCycle: 30
                      duration: 30

  # ──────────────────────────────────────────────
  # Subscriptions (User)
  # ──────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: getSubscriptions
      summary: Get subscriptions the user has purchased
      tags: [Subscriptions]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
          description: User subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Subscriptions'

  /subscriptions/tiers:
    get:
      operationId: getSubscriptionTiers
      summary: Get subscription tiers for the authenticated account
      tags: [Subscriptions]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
          description: Subscription tiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericArray'

  # ──────────────────────────────────────────────
  # Posts
  # ──────────────────────────────────────────────
  /post:
    get:
      operationId: getPosts
      summary: Get posts by IDs
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: ids
          in: query
          required: true
          description: Comma-separated post IDs
          schema:
            type: string
      responses:
        '200':
          description: Posts with related data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PostsData'
    post:
      operationId: createPost
      summary: Create a new post
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                wallIds:
                  type: array
                  items:
                    type: string
                attachments:
                  type: array
                  items:
                    type: object
                fypFlags:
                  type: integer
                  default: 0
                  description: "0=none, 2=hashtag, 4=overwrite"
                inReplyTo:
                  type: string
                  nullable: true
                quotedPostId:
                  type: string
                  nullable: true
                scheduledFor:
                  type: integer
                  default: 0
                  description: Unix timestamp in seconds (0 = publish now)
                expiresAt:
                  type: integer
                  default: 0
                postReplyPermissionFlags:
                  type: array
                  items:
                    type: integer
                pinned:
                  type: integer
                  default: 0
                pinWallIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Created post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_GenericObject'

  /post/scheduled:
    get:
      operationId: getScheduledPosts
      summary: Get scheduled posts
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
          description: Scheduled posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    properties:
                      scheduledPosts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Post'

  /post/scheduled/{postId}/cancel:
    post:
      operationId: cancelScheduledPost
      summary: Cancel a scheduled post
      tags: [Posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  # ──────────────────────────────────────────────
  # Timeline
  # ──────────────────────────────────────────────
  /timeline/home:
    get:
      operationId: getHomeTimeline
      summary: Get home feed
      tags: [Timeline]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - name: mode
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Home timeline posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PostsData'

  /timelinenew/{accountId}:
    get:
      operationId: getAccountTimeline
      summary: Get timeline for a specific account
      tags: [Timeline]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - name: wallId
          in: query
          description: Filter by wall ID
          schema:
            type: string
        - name: contentSearch
          in: query
          description: Search within post content
          schema:
            type: string
      responses:
        '200':
          description: Account timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PostsData'

  /timeline/permissions:
    get:
      operationId: getTimelinePermissions
      summary: Get timeline access permissions
      tags: [Timeline]
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
      responses:
        '200':
