    NotificationType:
      type: integer
      description: |
        1002=MediaLike, 1004=MediaLikeUndo, 1005=MediaLikeRedo,
        2002=PostLike, 2007=PostLikeUndo, 2008=PostLikeRedo,
        3002=NewFollower, 3003=FollowedBack, 5003=MessageLike,
        7001=Tip, 7100=TipGoal, 15006=NewSubscriber,
        15007=SubscriberRenewalFail, 15011=SubscriptionCanceled,
        15016=RenewedSubscription
      enum: [1002, 1004, 1005, 2002, 2007, 2008, 3002, 3003, 5003, 7001, 7100, 15006, 15007, 15011, 15016]

    TransactionType:
      type: integer
      description: |
        2010=MediaLegacy, 2016=MediaSetsLegacy, 2110=Media, 2116=MediaSets,
        6002=SpecialWallet, 6101=Transaction6101, 6515=SubscriptionPurchase,
        7001=TipsLegacy, 7101=Tips, 14001=Transaction14001,
        15001=Subscriptions, 18001=Referrals, 18002=ReferralVariant,
        24101=LeaderboardPrizeMoney, 32001=StoryBundle, 32101=BundleVariant,
        42001=Poll, 45001=StreamTickets, 45101=StreamTicketsVariant
      enum: [2010, 2016, 2110, 2116, 6002, 6101, 6515, 7001, 7101, 14001, 15001, 18001, 18002, 24101, 32001, 32101, 42001, 45001, 45101]

    MediaType:
