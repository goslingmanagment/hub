                contentType:
                  type: integer
                  default: 12000
                contentId:
                  type: string
                title:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  # ──────────────────────────────────────────────
  # Media Upload (mediav2.fansly.com)
  # ──────────────────────────────────────────────
  /media/upload/create:
    post:
      operationId: createMediaUpload
      summary: Initiate a multipart media upload
      description: |
        Returns pre-signed S3 URLs for direct upload.
        Upload flow:
        1. Call this endpoint to get upload URLs
        2. PUT each chunk directly to the S3 `uploadUrl`
        3. Call `/media/upload/complete` with all part ETags
        4. Poll `/media/upload/{id}` until `status >= 6`
      tags: [MediaUpload]
      servers:
        - url: https://mediav2.fansly.com/api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileSize, mimeType, fileName]
              properties:
                fileSize:
                  type: integer
                mimeType:
                  type: string
                fileName:
                  type: string
      responses:
        '200':
          description: Upload descriptor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    $ref: '#/components/schemas/MediaUpload'

  /media/upload/complete:
    post:
      operationId: completeMediaUpload
      summary: Complete a multipart upload
      tags: [MediaUpload]
      servers:
        - url: https://mediav2.fansly.com/api/v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, partSize, parts]
              properties:
                id:
                  type: string
                type:
                  type: integer
                  default: 1
                partSize:
                  type: integer
                status:
                  type: integer
                  default: 0
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      index:
                        type: integer
                      eTag:
                        type: string
                waitForComplete:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBase'

  /media/upload/{uploadId}:
    get:
      operationId: getMediaUploadStatus
      summary: Check media upload/processing status
      tags: [MediaUpload]
      servers:
        - url: https://mediav2.fansly.com/api/v1
      parameters:
        - $ref: '#/components/parameters/NgswBypass'
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: integer
                        description: "0=Unknown, 1=Created, 2=Uploading, 3=Uploaded, 4=Completing, 5=Processing, 6=Completed"
                      mediaId:
                        type: string
                      media:
                        $ref: '#/components/schemas/Media'

